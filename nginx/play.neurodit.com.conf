# ==============================================================================
# Configuración Nginx Server Block - play.neurodit.com
# Arquitectura: Host Nginx como Reverse Proxy SSL hacia Contenedor Docker (Puerto 3000)
# ==============================================================================

# 1. Redirección HTTP (Puerto 80) a HTTPS seguro
server {
    listen 80;
    listen [::]:80;
    server_name play.neurodit.com;

    # Ruta para desafíos de validación Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirección permanente a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS (Puerto 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.neurodit.com;

    # Certificados SSL gestionados por Certbot / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/play.neurodit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.neurodit.com/privkey.pem;

    # Parámetros de seguridad SSL recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Encabezados de Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logs del Dominio
    access_log /var/log/nginx/play.neurodit.com.access.log;
    error_log /var/log/nginx/play.neurodit.com.error.log;

    # Proxy inverso hacia la aplicación contenerizada (Docker en 127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
